<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warlords RTS</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        display: block;
      }
      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        color: #e8e8e8;
        background: rgba(0, 0, 0, 0.65);
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.5;
        pointer-events: none;
        user-select: none;
      }
      #hud strong {
        color: #f0c040;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div><strong>Warlords</strong> — Phase 0 / Vertical Slice</div>
        <div>Left-drag: pan · Wheel: zoom · Right-drag: rotate</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

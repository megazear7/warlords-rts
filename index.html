<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warlords RTS</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #0a0a0a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #app { width: 100%; height: 100%; position: relative; }
      canvas { display: block; }

      /* HUD — 2172×724 (exactly 3:1) ornate frames, centered */
      #hud {
        position: absolute;
        left: 50%;
        bottom: 4px;
        transform: translateX(-50%);
        width: min(94vw, calc(28vh * 2172 / 724));
        aspect-ratio: 2172 / 724;
        height: auto;
        color: #3a2a18;
        background-color: transparent;
        background-image: url('/ui/generic-heads-up-display.png');
        background-repeat: no-repeat;
        background-size: 100% 100%;
        background-position: center;
        /* % padding is of width. 6.6% of W ≈ 20% of H (under the crest). */
        padding: 6.6% 11% 2% 11%;
        box-sizing: border-box;
        border: none;
        border-radius: 0;
        font-size: 13px;
        line-height: 1.3;
        pointer-events: none;
        user-select: none;
        display: none;
        flex-direction: column;
        justify-content: flex-start;
        gap: 4px;
        z-index: 10;
        overflow: hidden;
      }
      #hud[data-frame="rome"] { background-image: url('/ui/roman-heads-up-display.png'); }
      #hud[data-frame="persia"] { background-image: url('/ui/persian-heads-up-display.png'); }
      #hud[data-frame="generic"] { background-image: url('/ui/generic-heads-up-display.png'); }
      #hud strong { color: #7a4a10; }
      .hud-strip {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        flex-wrap: nowrap;
        flex-shrink: 0;
      }
      .hud-brand {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7a4a10;
        font-weight: 700;
        flex-shrink: 0;
      }
      .hud-resources {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        font-variant-numeric: tabular-nums;
      }
      .hud-resources span {
        background: rgba(90, 55, 20, 0.08);
        border: 1px solid rgba(120, 80, 30, 0.22);
        border-radius: 999px;
        padding: 1px 7px;
        font-size: 11px;
        color: #3a2a18;
      }
      .hud-meta {
        margin-left: auto;
        text-align: right;
        font-size: 11px;
        color: #5a4630;
        min-width: 0;
        flex: 1 1 auto;
      }
      .hud-main {
        display: grid;
        grid-template-columns: auto minmax(120px, 0.8fr) minmax(200px, 1.4fr);
        gap: 8px;
        align-items: start;
        flex: 1;
        min-height: 0;
      }
      .hud-portraits {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        min-width: 0;
        padding-bottom: 2px;
      }
      .hud-card {
        position: relative;
        width: 64px;
        flex-shrink: 0;
      }
      .hud-card img {
        display: block;
        width: 64px;
        height: 64px;
        object-fit: cover;
        object-position: center 18%;
        border-radius: 6px;
        border: 1px solid rgba(122, 74, 16, 0.45);
        box-shadow: 0 2px 8px rgba(60, 30, 8, 0.25);
      }
      .hud-card-count {
        position: absolute;
        top: 4px;
        right: 4px;
        background: rgba(0, 0, 0, 0.75);
        color: #f0c040;
        font-size: 11px;
        font-weight: 700;
        min-width: 18px;
        text-align: center;
        padding: 1px 5px;
        border-radius: 999px;
        border: 1px solid rgba(240, 192, 64, 0.4);
      }
      .hud-card-hp {
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: 6px;
        height: 5px;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 999px;
        overflow: hidden;
      }
      .hud-card-hp > i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #2f8a44, #6dff8a);
        width: 100%;
      }
      .hud-card-hp.is-mid > i { background: linear-gradient(90deg, #8a6a12, #ffcc44); }
      .hud-card-hp.is-low > i { background: linear-gradient(90deg, #8a1a1a, #ff5555); }
      .hud-empty {
        color: #6a5640;
        font-size: 12px;
        align-self: center;
        padding: 0 8px;
      }
      .hud-detail {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 3px;
        min-width: 0;
      }
      .hud-commands {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        justify-content: flex-end;
        gap: 4px;
        min-width: 0;
        pointer-events: auto;
      }
      .hud-cmd {
        position: relative;
        width: 48px;
        height: 48px;
        padding: 0;
        border: none;
        background: transparent;
        cursor: pointer;
        border-radius: 8px;
      }
      .hud-cmd img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
        pointer-events: none;
      }
      .hud-cmd span {
        position: absolute;
        left: 3px;
        right: 3px;
        bottom: 5px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-align: center;
        color: #f6e7b4;
        text-shadow: 0 1px 2px #000, 0 0 8px #000;
        pointer-events: none;
        line-height: 1.1;
      }
      .hud-cmd:hover:not(:disabled) {
        filter: brightness(1.12);
        transform: translateY(-1px);
      }
      .hud-cmd:disabled {
        opacity: 0.38;
        cursor: not-allowed;
        filter: grayscale(0.35);
      }
      .hud-cmd.is-active {
        box-shadow: 0 0 0 2px #f0c040, 0 0 10px rgba(240, 192, 64, 0.45);
      }
      .hud-selection { color: #3a2a18; }
      .hud-selection .sel-name {
        font-size: 15px;
        font-weight: 700;
        color: #7a4a10;
        letter-spacing: 0.02em;
      }
      .hud-selection .sel-sub { font-size: 12px; color: #5a4630; }
      .hud-selection .sel-status { font-size: 12px; color: #3d6b2a; }
      .hud-selection .sel-status.warn { color: #a04a10; }
      .hud-research { color: #3d4a6b; font-size: 11px; }
      .hud-help {
        padding-top: 6px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 10px; color: #777; line-height: 1.45;
      }
      .hud-market {
        margin-top: 2px;
        padding: 4px 6px;
        background: rgba(90, 55, 20, 0.08);
        border-radius: 6px;
        font-size: 11px;
        color: #4a3824;
      }

      /* Home-screen background video */
      #menu-bg-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 40;
        pointer-events: none;
        display: none;
        background: #0a0a0a;
      }
      #app.menu-home #menu-bg-video { display: block; }

      /* UI Overlay */
      #ui-overlay {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        z-index: 50;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(6px);
      }
      #ui-overlay.ui-hidden {
        display: none;
        pointer-events: none;
      }
      #ui-overlay.ui-home {
        background: rgba(6, 5, 3, 0.28);
        backdrop-filter: blur(1.5px);
      }

      .menu-panel {
        background: linear-gradient(160deg, #1a1e24 0%, #12151a 100%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 28px 32px;
        min-width: 320px;
        max-width: 420px;
        width: 90%;
        color: #e8e8e8;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .menu-panel h1 {
        font-size: 42px;
        letter-spacing: 0.12em;
        color: #f0c040;
        text-align: center;
      }
      .menu-panel h2 {
        font-size: 22px;
        margin-bottom: 16px;
        color: #f0c040;
      }
      .tagline {
        text-align: center;
        color: #888;
        margin: 6px 0 22px;
        font-size: 13px;
      }
      .menu-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .menu-panel button {
        background: #2a3038;
        color: #eee;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .menu-panel button:hover:not(:disabled) {
        background: #3a4250;
        border-color: #f0c040;
      }
      .menu-panel button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .menu-panel button.secondary {
        background: transparent;
        margin-top: 8px;
      }
      .menu-panel button.danger {
        color: #ff8a8a;
        border-color: rgba(255, 100, 100, 0.3);
      }
      .menu-footer {
        margin-top: 18px;
        text-align: center;
        font-size: 13px;
        color: #999;
      }
      .menu-footer strong { color: #e8e8e8; }

      .slot-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
      }
      .slot-btn {
        text-align: left !important;
      }
      .slot-meta {
        font-size: 11px;
        color: #888;
      }
      .size-heading {
        font-size: 14px;
        color: #f0c040;
        margin: 16px 0 8px;
      }
      .size-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 14px;
      }
      .size-btn {
        text-align: left !important;
        padding: 10px 12px !important;
      }
      .size-btn.selected {
        border-color: #f0c040 !important;
        background: rgba(240, 192, 64, 0.12) !important;
      }

      .settings-panel label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 10px 0;
        font-size: 13px;
      }
      .settings-panel label.checkbox {
        justify-content: flex-start;
      }
      .settings-panel input[type="range"] { width: 140px; }
      .settings-panel select,
      .settings-panel input[type="text"] {
        background: #0e1115;
        color: #eee;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 6px 10px;
      }
      .menu-row {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      .menu-row button { flex: 1; }

      .profile-stats {
        margin: 14px 0;
        font-size: 13px;
        line-height: 1.7;
        color: #bbb;
      }
      .profile-stats strong { color: #f0c040; }

      .end-screen { text-align: center; }
      .end-screen h1.victory { color: #44ff88; }
      .end-screen h1.defeat { color: #ff5555; }
      .end-screen p { margin: 12px 0 20px; color: #aaa; }

      /* Toast */
      #toast {
        position: absolute;
        bottom: calc(28vh + 16px);
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(0, 0, 0, 0.85);
        color: #eee;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 60;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      #toast.toast-show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Research Panel */
      #research-panel {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 40;
        pointer-events: all;
      }
      .research-panel-inner {
        background: linear-gradient(160deg, #1a1e24 0%, #12151a 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 20px 24px;
        min-width: 380px;
        max-width: 480px;
        color: #e8e8e8;
        box-shadow: 0 16px 48px rgba(0,0,0,0.6);
        backdrop-filter: blur(4px);
        font-size: 13px;
      }
      .research-panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 15px;
        font-weight: 700;
        color: #f0c040;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      .research-close {
        background: none;
        border: none;
        color: #888;
        cursor: pointer;
        font-size: 16px;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .research-close:hover { color: #eee; background: rgba(255,255,255,0.1); }
      .research-tracks { display: flex; flex-direction: column; gap: 10px; }
      .research-row {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .research-row--active {
        border-color: rgba(240,192,64,0.4);
        background: rgba(240,192,64,0.06);
      }
      .research-row--maxed {
        opacity: 0.5;
      }
      .research-row-main {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .research-icon { font-size: 20px; flex-shrink: 0; }
      .research-info { flex: 1; min-width: 0; }
      .research-name { font-weight: 600; font-size: 14px; }
      .research-level { color: #f0c040; font-weight: 700; }
      .research-effect { font-size: 11px; color: #999; margin: 2px 0; }
      .research-cost { font-size: 12px; color: #aaa; }
      .research-reason { color: #ff8a8a; margin-left: 6px; }
      .research-btn {
        background: #2a3038;
        color: #eee;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 6px;
        padding: 7px 12px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .research-btn:hover:not(:disabled) {
        background: #3a4250;
        border-color: #f0c040;
      }
      .research-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .research-panel-footer {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.08);
        font-size: 11px;
        color: #666;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <video
        id="menu-bg-video"
        muted
        loop
        playsinline
        preload="auto"
        aria-hidden="true"
      >
        <source src="/video/home-screen-background.mp4" type="video/mp4" />
      </video>
      <div id="hud"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

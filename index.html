<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warlords RTS</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #0a0a0a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #app { width: 100%; height: 100%; position: relative; }
      canvas { display: block; }

      /* HUD */
      #hud {
        position: absolute; top: 12px; left: 12px;
        color: #e8e8e8;
        background: rgba(0, 0, 0, 0.75);
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.55;
        pointer-events: none;
        user-select: none;
        min-width: 280px;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        display: none;
        z-index: 10;
      }
      #hud strong { color: #f0c040; }
      .hud-title { margin-bottom: 6px; font-size: 14px; }
      .hud-resources {
        display: flex; flex-wrap: wrap; gap: 8px 12px;
        margin: 6px 0;
        font-variant-numeric: tabular-nums;
      }
      .hud-selection { margin-top: 4px; color: #a8d4a8; }
      .hud-research { margin-top: 4px; color: #a8c4e8; font-size: 12px; }
      .hud-help {
        margin-top: 10px; padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 11px; color: #999; line-height: 1.5;
      }

      /* UI Overlay */
      #ui-overlay {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        z-index: 50;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(6px);
      }
      #ui-overlay.ui-hidden {
        display: none;
        pointer-events: none;
      }

      .menu-panel {
        background: linear-gradient(160deg, #1a1e24 0%, #12151a 100%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 28px 32px;
        min-width: 320px;
        max-width: 420px;
        width: 90%;
        color: #e8e8e8;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .menu-panel h1 {
        font-size: 42px;
        letter-spacing: 0.12em;
        color: #f0c040;
        text-align: center;
      }
      .menu-panel h2 {
        font-size: 22px;
        margin-bottom: 16px;
        color: #f0c040;
      }
      .tagline {
        text-align: center;
        color: #888;
        margin: 6px 0 22px;
        font-size: 13px;
      }
      .menu-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .menu-panel button {
        background: #2a3038;
        color: #eee;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .menu-panel button:hover:not(:disabled) {
        background: #3a4250;
        border-color: #f0c040;
      }
      .menu-panel button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .menu-panel button.secondary {
        background: transparent;
        margin-top: 8px;
      }
      .menu-panel button.danger {
        color: #ff8a8a;
        border-color: rgba(255, 100, 100, 0.3);
      }
      .menu-footer {
        margin-top: 18px;
        text-align: center;
        font-size: 13px;
        color: #999;
      }
      .menu-footer strong { color: #e8e8e8; }

      .slot-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
      }
      .slot-btn {
        text-align: left !important;
      }
      .slot-meta {
        font-size: 11px;
        color: #888;
      }

      .settings-panel label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 10px 0;
        font-size: 13px;
      }
      .settings-panel label.checkbox {
        justify-content: flex-start;
      }
      .settings-panel input[type="range"] { width: 140px; }
      .settings-panel select,
      .settings-panel input[type="text"] {
        background: #0e1115;
        color: #eee;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 6px 10px;
      }
      .menu-row {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      .menu-row button { flex: 1; }

      .profile-stats {
        margin: 14px 0;
        font-size: 13px;
        line-height: 1.7;
        color: #bbb;
      }
      .profile-stats strong { color: #f0c040; }

      .end-screen { text-align: center; }
      .end-screen h1.victory { color: #44ff88; }
      .end-screen h1.defeat { color: #ff5555; }
      .end-screen p { margin: 12px 0 20px; color: #aaa; }

      /* Toast */
      #toast {
        position: absolute;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(0, 0, 0, 0.85);
        color: #eee;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 60;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      #toast.toast-show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Research Panel */
      #research-panel {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 40;
        pointer-events: all;
      }
      .research-panel-inner {
        background: linear-gradient(160deg, #1a1e24 0%, #12151a 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 20px 24px;
        min-width: 380px;
        max-width: 480px;
        color: #e8e8e8;
        box-shadow: 0 16px 48px rgba(0,0,0,0.6);
        backdrop-filter: blur(4px);
        font-size: 13px;
      }
      .research-panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 15px;
        font-weight: 700;
        color: #f0c040;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      .research-close {
        background: none;
        border: none;
        color: #888;
        cursor: pointer;
        font-size: 16px;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .research-close:hover { color: #eee; background: rgba(255,255,255,0.1); }
      .research-tracks { display: flex; flex-direction: column; gap: 10px; }
      .research-row {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .research-row--active {
        border-color: rgba(240,192,64,0.4);
        background: rgba(240,192,64,0.06);
      }
      .research-row--maxed {
        opacity: 0.5;
      }
      .research-row-main {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .research-icon { font-size: 20px; flex-shrink: 0; }
      .research-info { flex: 1; min-width: 0; }
      .research-name { font-weight: 600; font-size: 14px; }
      .research-level { color: #f0c040; font-weight: 700; }
      .research-effect { font-size: 11px; color: #999; margin: 2px 0; }
      .research-cost { font-size: 12px; color: #aaa; }
      .research-reason { color: #ff8a8a; margin-left: 6px; }
      .research-btn {
        background: #2a3038;
        color: #eee;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 6px;
        padding: 7px 12px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .research-btn:hover:not(:disabled) {
        background: #3a4250;
        border-color: #f0c040;
      }
      .research-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .research-panel-footer {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.08);
        font-size: 11px;
        color: #666;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

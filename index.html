<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warlords RTS</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #0a0a0a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #app { width: 100%; height: 100%; position: relative; }
      canvas { display: block; }
      #hud {
        position: absolute; top: 12px; left: 12px;
        color: #e8e8e8;
        background: rgba(0, 0, 0, 0.75);
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.55;
        pointer-events: none;
        user-select: none;
        min-width: 280px;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      #hud strong { color: #f0c040; }
      .hud-title { margin-bottom: 6px; font-size: 14px; }
      .hud-resources {
        display: flex; flex-wrap: wrap; gap: 8px 12px;
        margin: 6px 0;
        font-variant-numeric: tabular-nums;
      }
      .hud-resources span { white-space: nowrap; }
      .hud-selection { margin-top: 4px; color: #a8d4a8; }
      .hud-research { margin-top: 4px; color: #a8c4e8; font-size: 12px; }
      .hud-help {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 11px;
        color: #999;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
